<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>HPCL Receipts Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Press Start 2P', monospace;
      background: #eee;
      padding: 20px;
    }

    h3 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-section {
      margin: 0 auto 20px;
      max-width: 1100px;
      font-family: monospace;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(220px, 1fr));
      gap: 10px 16px;
      align-items: end;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      font-size: 12px;
    }

    .range-inputs {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .range-inputs input {
      width: calc(50% - 10px);
    }

    button {
      display: block;
      margin: 0 auto;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .logo {
      width: 70px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 10px;
      font-weight: bold;
      margin-top: 4px;
    }

    .section,
    .footer {
      font-size: 9px;
      line-height: 1.4;
      text-align: left;
      margin-top: 9px;
    }

    .section-center {
      text-align: center;
    }

    .footer {
      font-size: 7.5px;
      text-align: center;
    }

    .receipts-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .receipt {
      flex: 1 1 calc(50% - 20px);
      box-sizing: border-box;
      max-width: 256px;
      background: #efefefcc;
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    @media (max-width: 1000px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }
    }

    @media (max-width: 560px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }

      .receipts-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: flex-start;
      }

      .receipt {
        page-break-inside: avoid;
        break-inside: avoid;
        border: 1px solid #000;
        background: #fff;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <h3>HPCL Receipts Generator</h3>

  <div class="input-section">
    <div class="form-grid">
      <div class="field">
        <label for="vehType">VEH TYPE:</label>
        <select id="vehType">
          <option value="Petrol" selected>Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="CNG">CNG</option>
          <option value="EV">EV</option>
        </select>
      </div>

      <div class="field">
        <label for="vehNo">VEH NO:</label>
        <input type="text" id="vehNo" value="UP13 AT6119">
      </div>

      <div class="field">
        <label for="custName">CUSTOMER NAME:</label>
        <input type="text" id="custName" value="Mithun Kumar">
      </div>

      <div class="field">
        <label for="fromDate">FROM DATE:</label>
        <input type="date" id="fromDate">
      </div>

      <div class="field">
        <label for="toDate">TO DATE:</label>
        <input type="date" id="toDate">
      </div>

      <div class="field">
        <label for="fuelRangeStart">FUEL RANGE (LTR):</label>
        <div class="range-inputs">
          <input type="number" id="fuelRangeStart" min="0.1" step="0.1" value="8">
          <span>-</span>
          <input type="number" id="fuelRangeEnd" min="0.1" step="0.1" value="20">
        </div>
      </div>

      <div class="field">
        <label for="city">CITY:</label>
        <input type="text" id="city" value="Ghaziabad">
      </div>

      <div class="field">
        <label for="state">STATE:</label>
        <input type="text" id="state" value="Uttar Pradesh">
      </div>
    </div>

    <button id="generateBtn" type="button">Generate Receipts</button>
  </div>

  <hr>

  <div id="receipts" class="receipts-container"></div>

  <script src="generator.js"></script>
</body>

</html>
